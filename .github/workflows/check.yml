name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The engine version and its SHA512 are NOT written here: they live in scripts/engine_version.txt, which
# check.ps1, release.ps1 and build_installer.ps1 also read. The "Read engine version" step loads them into
# GODOT_VERSION, GODOT_ZIP_SHA512, GODOT_TEMPLATES_SHA512 and INNO_SETUP_VERSION for the steps below.
env:
  # Bump to throw away every cached .godot import folder at once (see docs/CI.md).
  IMPORT_CACHE_SALT: v1

jobs:
  check:
    # Pinned, not windows-latest: the installer step below depends on what is preinstalled (Git's OpenSSL for
    # the signing checks, Chocolatey for Inno Setup, PowerShell 5.1 for the scripts), and "latest" moves to a new
    # image on GitHub's schedule, which would break the build on a day nobody touched the repo. Move this on
    # purpose, in a pull request that shows the full run passing on the new image.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read engine version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $found = @{}
          foreach ($line in Get-Content -LiteralPath scripts/engine_version.txt) {
            if ($line -match '^\s*([A-Z][A-Z0-9_]*)=(\S+)\s*$') { $found[$Matches[1]] = $Matches[2] }
          }
          foreach ($key in 'GODOT_VERSION', 'GODOT_ZIP_SHA512', 'GODOT_TEMPLATES_SHA512', 'INNO_SETUP_VERSION') {
            if (-not $found.ContainsKey($key)) { throw "$key is missing from scripts/engine_version.txt" }
            "$key=$($found[$key])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = 0
          foreach ($f in Get-ChildItem scripts -Filter *.ps1) {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            foreach ($e in $parseErrors) { Write-Host "::error file=scripts/$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $errors++ }
          }
          if ($errors) { throw "$errors PowerShell parse error(s)" }

      - name: Cache Godot engine
        id: godot-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-win64-${{ env.GODOT_ZIP_SHA512 }}

      - name: Download Godot engine
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $url = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION/Godot_v${env:GODOT_VERSION}_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA512 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:GODOT_ZIP_SHA512) { throw "SHA512 mismatch: expected $env:GODOT_ZIP_SHA512, got $actual" }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          Remove-Item $zip

      # Godot's import folder (.godot: imported textures and audio, the class and uid caches). Importing the
      # painted art from scratch is the slowest part of a cold run. This can only save time, never hide a
      # failure, because:
      #  - the key is an exact hash of everything that affects import (scripts, scenes, resources, .import and
      #    .uid files, the art and audio, project settings, the engine version); there is no restore-keys
      #    fallback, so a hit is a byte-identical project and anything else imports cold;
      #  - check.ps1 still runs `--import` first, so even a hit is re-validated by the engine;
      #  - the cache is saved only when the whole job succeeded (the default for actions/cache), so a failing run
      #    never writes one.
      # To force a cold run, bump IMPORT_CACHE_SALT at the top of this file.
      - name: Cache Godot import folder
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .godot
          key: godot-import-${{ env.IMPORT_CACHE_SALT }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', 'export_presets.cfg', '**/*.import', '**/*.uid', '**/*.gd', '**/*.tscn', '**/*.tres', '**/*.gdshader', 'art/**', 'audio/**') }}

      - name: Run full check
        shell: pwsh
        run: |
          $env:GODOT_EXE = Join-Path $env:RUNNER_TEMP "godot\Godot_v${env:GODOT_VERSION}_win64_console.exe"
          powershell -ExecutionPolicy Bypass -File scripts/check.ps1
          exit $LASTEXITCODE

      # Release-day breakage (a broken export preset, a missing export template, an installer script that no
      # longer compiles, a version string that disagrees with project.godot) should show up on the pull request,
      # not when you run scripts/release.ps1. These steps build the Windows export and the installer WITHOUT
      # signing (-NoSign: no private key exists on the runner) and never publish anything; the output is thrown
      # away with the runner. Only the three Windows templates are kept (about 300 MB less than the full .tpz).
      - name: Cache Windows export templates
        id: templates-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/godot_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-${{ env.GODOT_TEMPLATES_SHA512 }}

      - name: Download Windows export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'godot_templates'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $tpz = Join-Path $env:RUNNER_TEMP 'templates.tpz'
          $url = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION/Godot_v${env:GODOT_VERSION}_export_templates.tpz"
          Invoke-WebRequest -Uri $url -OutFile $tpz
          $actual = (Get-FileHash -Algorithm SHA512 -LiteralPath $tpz).Hash.ToLowerInvariant()
          if ($actual -ne $env:GODOT_TEMPLATES_SHA512) { throw "SHA512 mismatch: expected $env:GODOT_TEMPLATES_SHA512, got $actual" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $wanted = 'version.txt', 'windows_release_x86_64.exe', 'windows_release_x86_64_console.exe'
          $zip = [System.IO.Compression.ZipFile]::OpenRead($tpz)
          try {
            foreach ($entry in $zip.Entries) {
              if ($wanted -contains $entry.Name) {
                [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $dir $entry.Name), $true)
              }
            }
          } finally { $zip.Dispose() }
          foreach ($name in $wanted) { if (-not (Test-Path (Join-Path $dir $name))) { throw "$name is missing from the export templates" } }
          Remove-Item $tpz

      - name: Install export templates and Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Godot looks for templates in %APPDATA%\Godot\export_templates\<version with the dash as a dot>.
          $dest = Join-Path $env:APPDATA ('Godot\export_templates\' + ($env:GODOT_VERSION -replace '-', '.'))
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'godot_templates\*') $dest
          # The exact version from scripts/engine_version.txt, the one the release is built with.
          choco install innosetup --version=$env:INNO_SETUP_VERSION --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco could not install Inno Setup $env:INNO_SETUP_VERSION" }

      - name: Build the installer (unsigned)
        shell: pwsh
        run: |
          $env:GODOT_EXE = Join-Path $env:RUNNER_TEMP "godot\Godot_v${env:GODOT_VERSION}_win64_console.exe"
          powershell -ExecutionPolicy Bypass -File scripts/build_installer.ps1 -NoSign
          exit $LASTEXITCODE
