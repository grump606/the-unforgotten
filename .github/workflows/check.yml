name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The engine version and its SHA512 are NOT written here: they live in scripts/engine_version.txt, which
# check.ps1, release.ps1 and build_installer.ps1 also read. The "Read engine version" step loads them into
# GODOT_VERSION and GODOT_ZIP_SHA512 for the steps below.
env:
  # Bump to throw away every cached .godot import folder at once (see docs/CI.md).
  IMPORT_CACHE_SALT: v1

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read engine version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $found = @{}
          foreach ($line in Get-Content -LiteralPath scripts/engine_version.txt) {
            if ($line -match '^\s*([A-Z][A-Z0-9_]*)=(\S+)\s*$') { $found[$Matches[1]] = $Matches[2] }
          }
          foreach ($key in 'GODOT_VERSION', 'GODOT_ZIP_SHA512') {
            if (-not $found.ContainsKey($key)) { throw "$key is missing from scripts/engine_version.txt" }
            "$key=$($found[$key])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = 0
          foreach ($f in Get-ChildItem scripts -Filter *.ps1) {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            foreach ($e in $parseErrors) { Write-Host "::error file=scripts/$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $errors++ }
          }
          if ($errors) { throw "$errors PowerShell parse error(s)" }

      - name: Cache Godot engine
        id: godot-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-win64-${{ env.GODOT_ZIP_SHA512 }}

      - name: Download Godot engine
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $url = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION/Godot_v${env:GODOT_VERSION}_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA512 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:GODOT_ZIP_SHA512) { throw "SHA512 mismatch: expected $env:GODOT_ZIP_SHA512, got $actual" }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          Remove-Item $zip

      # Godot's import folder (.godot: imported textures and audio, the class and uid caches). Importing the
      # painted art from scratch is the slowest part of a cold run. This can only save time, never hide a
      # failure, because:
      #  - the key is an exact hash of everything that affects import (scripts, scenes, resources, .import and
      #    .uid files, the art and audio, project settings, the engine version); there is no restore-keys
      #    fallback, so a hit is a byte-identical project and anything else imports cold;
      #  - check.ps1 still runs `--import` first, so even a hit is re-validated by the engine;
      #  - the cache is saved only when the whole job succeeded (the default for actions/cache), so a failing run
      #    never writes one.
      # To force a cold run, bump IMPORT_CACHE_SALT at the top of this file.
      - name: Cache Godot import folder
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .godot
          key: godot-import-${{ env.IMPORT_CACHE_SALT }}-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', 'export_presets.cfg', '**/*.import', '**/*.uid', '**/*.gd', '**/*.tscn', '**/*.tres', '**/*.gdshader', 'art/**', 'audio/**') }}

      - name: Run full check
        shell: pwsh
        run: |
          $env:GODOT_EXE = Join-Path $env:RUNNER_TEMP "godot\Godot_v${env:GODOT_VERSION}_win64_console.exe"
          powershell -ExecutionPolicy Bypass -File scripts/check.ps1
          exit $LASTEXITCODE
